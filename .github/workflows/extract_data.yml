name: "Extraction et Déchiffrement Manuel"

on:
  workflow_dispatch:
    inputs:
      decrypt_data:
        description: 'Déchiffrer les données (True/False)'
        required: true
        default: 'false'
        type: boolean

jobs:
  extract:
    runs-on: self-hosted
    steps:
      - name: Checkout du repo
        uses: actions/checkout@v4

      - name: Execution de l'extraction
        env:
          DECRYPT_DATA: ${{ github.event.inputs.decrypt_data }}
          KEY_ENCRYPT_MINIMAL_DATASET: ${{ secrets.KEY_ENCRYPT_MINIMAL_DATASET }}
        run: |
          # On se place là où le script se trouve réellement
          SCRIPT_PATH=$(find . -name "manual_extract.py" | head -n 1)
          if [ -z "$SCRIPT_PATH" ]; then
            echo "Erreur : Fichier manual_extract.py introuvable dans $(pwd)"
            exit 1
          fi
          echo "Exécution de : $SCRIPT_PATH"
          python3 "$SCRIPT_PATH"