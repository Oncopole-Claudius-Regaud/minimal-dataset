name: Deploy ETL Oncopole

on:
  push:
    branches: POC_1 # ou develop si tu veux

jobs:
  deploy:
    name: Déployer le repo sur Airflow
    runs-on: ubuntu-latest
    steps:
      # 1️⃣ Récupérer le code du repo
      - name: Checkout code
        uses: actions/checkout@v3

      # 2️⃣ Créer le dossier sur le serveur et nettoyer l'ancien contenu
      - name: Préparer le serveur
        uses: appleboy/ssh-action@v0.1.9
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          debug: true
          script: |
            mkdir -p ~/airflow/dags/minimal-dataset
            rm -rf ~/airflow/dags/minimal-dataset/*

      # 3️⃣ Copier le repo sur le serveur
      - name: Copier le repo sur le serveur
        uses: appleboy/scp-action@v0.1.4
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          source: "./"  # copie tout le repo
          target: "~/airflow/dags/minimal-dataset"

      # 4️⃣ Redémarrer Airflow
      - name: Restart Airflow
        uses: appleboy/ssh-action@v0.1.9
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          debug: true
          script: |
            sudo systemctl restart airflow-webserver.service
            sudo systemctl restart airflow-scheduler.service
