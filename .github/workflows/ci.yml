name: Déploiement Local via Runner

on:
  push:
    branches:
      - POC_1

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout du repo
        uses: actions/checkout@v4

      - name: Mise à jour des DAGs et Redémarrage Airflow
        env:
          SUDO_PASS: ${{ secrets.HOST_PASSWORD }}
        run: |
          # Définition propre du dossier cible (on utilise l'underscore pour éviter les erreurs Python plus tard)
          TARGET_DIR="/home/administrateur/airflow/dags/minimal_dataset"
          
          echo "Début du déploiement dans $TARGET_DIR"

          # 1. Création du dossier avec sudo pour éviter les refus de permission
          echo "$SUDO_PASS" | sudo -S mkdir -p $TARGET_DIR
          echo "$SUDO_PASS" | sudo -S chown -R administrateur:administrateur $TARGET_DIR
          
          # 2. Nettoyage et Copie
          # On utilise -f pour forcer et on affiche ce qu'on fait
          rm -rf $TARGET_DIR/*
          cp -rv ./* $TARGET_DIR/
          
          # 3. Vérification immédiate pour le log GitHub
          echo "Contenu du dossier après copie :"
          ls -la $TARGET_DIR

          # 4. Redémarrage des services
          echo "Redémarrage d'Airflow..."
          echo "$SUDO_PASS" | sudo -S systemctl restart airflow-webserver
          echo "$SUDO_PASS" | sudo -S systemctl restart airflow-scheduler
          
          echo "Déploiement terminé avec succès."