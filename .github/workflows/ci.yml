name: Déploiement Local via Runner

on:
  push:
    branches:
      - POC_1

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout du repo
        uses: actions/checkout@v4

      - name: Mise à jour des DAGs et Redémarrage Airflow
        env:
          # On récupère le mot de passe depuis vos secrets GitHub
          SUDO_PASS: ${{ secrets.HOST_PASSWORD }}
        run: |
          # 1. Mise à jour des fichiers
          mkdir -p /home/administrateur/airflow/dags/minimal-dataset
          rm -rf /home/administrateur/airflow/dags/minimal-dataset/*
          cp -r ./* /home/administrateur/airflow/dags/minimal-dataset/
          
          echo "Fichiers copiés. Tentative de redémarrage des services..."

          # 2. Redémarrage des services avec sudo -S
          # On "injecte" le mot de passe dans la commande sudo
          echo "$SUDO_PASS" | sudo -S systemctl restart airflow-webserver
          echo "$SUDO_PASS" | sudo -S systemctl restart airflow-scheduler
          
          echo "Le déploiement et le redémarrage des services ont été effectués."